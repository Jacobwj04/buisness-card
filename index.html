<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jennie Wassall-Jamieson — Creative director and energy practitioner.">
    <meta name="theme-color" content="#C26D50">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <title>Jennie Wassall-Jamieson</title>
</head>
<body>
    <main class="card">
        <figure class="card__figure">
            <img src="./img/jennie.webp" alt="Portrait of Jennie Wassall-Jamieson" class="card__img">
        </figure>

        <header class="card__header">
            <h1 class="card__title">Jennie Wassall-Jamieson</h1>
            <p class="card__description">Creative director &amp; Energy practitioner</p>
        </header>

        <section class="card__contact">
            <a href="mailto:jennie@thewj5.com" class="card__link">
                <svg class="card__icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v.4l8 5 8-5V6H4Zm16 2.7-7.5 4.7a1 1 0 0 1-1 0L4 8.7V18h16V8.7Z"/>
                </svg>
                <span class="card__link-text">jennie@maisonjene.com</span>
            </a>
        </section>

        <section class="card__cta">
            <span class="card__button">
                <svg class="card__icon card__icon--light" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3a15.6 15.6 0 0 0-1-5 8 8 0 0 1 4 5ZM12 4.1c.8 1 1.6 2.9 1.8 6.9h-3.6c.2-4 1-5.9 1.8-6.9ZM4.1 13h3a15.6 15.6 0 0 0 1 5 8 8 0 0 1-4-5Zm3-2h-3a8 8 0 0 1 4-5 15.6 15.6 0 0 0-1 5Zm4.9 8.9c-.8-1-1.6-2.9-1.8-6.9h3.6c-.2 4-1 5.9-1.8 6.9Zm1.9-.9a15.6 15.6 0 0 0 1-5h3a8 8 0 0 1-4 5Z"/>
                </svg>
                <span class="card__button-text">Visit the website</span>
            </span>
            <span class="card__badge">Launching soon</span>
        </section>
    </main>
</body>
</html>
